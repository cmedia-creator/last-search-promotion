<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>検索</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page-shell">
    <header class="search-header">
      <div class="brand">Search</div>
      <form id="searchForm" class="search-box-wrap">
        <input id="searchInput" class="search-input" autocomplete="off" spellcheck="false" value="" aria-label="検索" />
        <button class="search-button" type="submit">検索</button>
      </form>
    </header>

    <section id="resultMeta" class="result-meta hidden"></section>
    <section id="results" class="results hidden" aria-live="polite"></section>
  </main>

  <div id="transition" class="transition hidden">
    <div class="transition-inner">
      <div class="ls-logo">LAST SEARCH</div>
      <div class="ls-searchbar"><span id="lsText"></span><span class="caret">|</span></div>
      <div class="ls-button">検索</div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
