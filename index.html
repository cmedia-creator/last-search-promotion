<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RUKA 20s</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090c;font-family:Arial,sans-serif}
#stage{position:relative;margin:auto;height:100vh;max-width:56.25vh;aspect-ratio:9/16;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 34%,#383842 0,#17171d 40%,#08080b 80%)}
#stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff08 1px,transparent 1px),linear-gradient(#ffffff08 1px,transparent 1px);background-size:30px 30px}
#name{position:absolute;left:7%;top:7%;font-size:min(14vw,72px);font-weight:900;letter-spacing:-.06em;opacity:0;transition:.5s}
#sub{position:absolute;left:8%;top:15%;font-size:min(3vw,16px);letter-spacing:.3em;opacity:0;transition:.5s}
#char{position:absolute;width:45%;left:-50%;bottom:19%;z-index:4;transform-origin:50% 100%}
#char img{display:block;width:100%;filter:drop-shadow(0 18px 12px #0008)}
.floor{position:absolute;left:6%;right:6%;bottom:17%;height:2px;background:#ffffff40;box-shadow:0 0 28px #ffffff30}
#caption{position:absolute;bottom:9%;left:5%;right:5%;text-align:center;font-size:min(4vw,20px);font-weight:800;letter-spacing:.12em;z-index:9}
#fx{position:absolute;inset:0;z-index:8;pointer-events:none}.fx{position:absolute;font-size:min(9vw,45px);animation:float 1.5s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.2) rotate(12deg)}}
@keyframes idle{50%{transform:translateY(-7px) rotate(.8deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-105px) scale(.97,1.04)}70%{transform:translateY(5px) scale(1.05,.95)}}
@keyframes dance{20%{transform:rotate(-8deg) translateY(-10px)}40%{transform:rotate(7deg)}60%{transform:rotate(-6deg) translateY(-12px)}80%{transform:rotate(8deg)}}
@keyframes sit{to{transform:translateY(25px) scale(1.04,.87)}}
#replay{position:absolute;right:5%;top:4%;z-index:20;border:1px solid #ffffff45;background:#0005;color:#fff;border-radius:99px;padding:8px 12px}
</style>
</head>
<body>
<main id="stage">
<div id="name">RUKA</div><div id="sub">MINI ROOM DEMO</div>
<div id="char"><img src="ruka.png" alt="RUKA"></div>
<div id="fx"></div><div class="floor"></div>
<div id="caption">RUNNING IN...</div><button id="replay">↻ REPLAY</button>
</main>
<script>
const c=document.querySelector("#char"),cap=document.querySelector("#caption"),nameEl=document.querySelector("#name"),sub=document.querySelector("#sub"),fx=document.querySelector("#fx");
let ts=[]; const later=(m,f)=>ts.push(setTimeout(f,m)); const text=s=>cap.textContent=s;
function anim(n,d,count=1){c.style.animation=`${n} ${d}s ease-in-out ${count}`;later(d*1000*count+30,()=>c.style.animation="")}
function burst(s,n){for(let i=0;i<n;i++)later(i*110,()=>{let e=document.createElement("span");e.className="fx";e.textContent=s;e.style.left=(42+Math.random()*28)+"%";e.style.top=(34+Math.random()*24)+"%";fx.append(e);setTimeout(()=>e.remove(),1550)})}
function run(){
ts.forEach(clearTimeout);ts=[];fx.innerHTML="";c.style.cssText="";c.style.position="absolute";c.style.width="45%";c.style.left="-50%";c.style.bottom="19%";c.style.zIndex="4";c.style.transformOrigin="50% 100%";
nameEl.style.opacity=0;nameEl.style.transform="translateY(-15px)";sub.style.opacity=0;sub.textContent="MINI ROOM DEMO";text("RUNNING IN...");
requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transition="left 1.65s cubic-bezier(.18,.7,.25,1)";c.style.left="28%"}));
later(1700,()=>{text("HELLO, RUKA.");anim("idle",1.05,3)});
later(2400,()=>{nameEl.style.opacity=1;nameEl.style.transform="translateY(0)";sub.style.opacity=1});
later(5000,()=>{text("WINK ♡");burst("♥",7);c.style.transform="rotate(-3deg) scale(1.04)"});
later(6800,()=>{c.style.transform="";anim("idle",.6,2)});
later(8000,()=>{text("JUMP!");anim("jump",1.05)});
later(9300,()=>{text("WALK →");c.style.transition="left 2s ease-in-out";c.style.left="47%"});
later(11300,()=>{c.style.transition="left .7s ease";c.style.left="31%"});
later(12000,()=>{text("DANCE MODE");anim("dance",.62,6);burst("♪",10)});
later(16000,()=>{text("BREAK TIME");c.style.animation="sit .55s ease forwards"});
later(17500,()=>{text("RUKA");sub.textContent="SEE YOU NEXT TIME";nameEl.style.transform="scale(1.12)"});
later(19500,()=>{c.style.transition="transform .45s ease";c.style.transform="scale(1.16)"});
}
document.querySelector("#replay").onclick=run;run();
</script>
</body></html>
